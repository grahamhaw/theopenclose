# Every push to main rebuilds the archive and deploys it.
#
# The build is the schema check: src/content.config.ts rejects a document that
# does not match the frontmatter spec in CLAUDE.md, so a malformed document
# fails here rather than rendering wrong and quietly rotting the archive.
#
# Deploy runs only when CLOUDFLARE_API_TOKEN is set. If you connect the repo to
# Cloudflare Workers Builds instead, leave the secret unset: this workflow then
# acts purely as the validation gate and Cloudflare does the deploying.

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The agent pushes several times a day. Cancel a run that a newer push has
# already superseded rather than queueing deploys behind each other.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # At job level so the deploy step's `if:` can read it. A secret that is not
    # set resolves to an empty string, which is how the deploy stays inert until
    # you choose this path over Workers Builds.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (validates every document against the schema)
        run: npm run build
        env:
          SITE_URL: https://theopenclose.com

      - name: Deploy to Cloudflare Workers
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
